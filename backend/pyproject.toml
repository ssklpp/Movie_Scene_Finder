[project]
name = "msf-backend"
version = "0.1.0"
description = "Movie Scene Finder backend (FastAPI)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "openai>=1.40",
    "httpx>=0.27",
    "kiwipiepy>=0.24.0",
    "mmh3>=5.3.1",
    "qdrant-client>=1.19.1",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-postgres>=3.1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
